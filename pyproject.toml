[project]
name = "ozersk-rabochiy"
version = "0.1.0"
description = "Озёрск Рабочий — пародийная новостная газета"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "bleach>=6.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 — FastAPI relies on Depends/File/Form/Form(...) defaults
# UP007/UP045 — keep Optional[...] to stay readable for newcomers
ignore = ["E501", "B008", "UP007", "UP045"]
